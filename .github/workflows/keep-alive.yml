name: Keep TarotTrader App Awake

# TarotTraderJournal (https://tarottraderjournal.onrender.com) runs on Render's free
# tier, which spins the app down after ~15 min of no inbound traffic. Ping it every
# 10 min (with margin for GitHub's own scheduling delays) so it never idles out.
# Lives in this repo (not the TarotTrader repo) because this repo is public, so
# GitHub Actions minutes are unlimited/free here — the TarotTrader repo is private.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        # --max-time 60: give Render room to cold-start if a ping was ever missed and it slept anyway
        # || true: a failed/slow ping shouldn't fail the workflow and spam a "run failed" email every time
        run: curl -sf --max-time 60 https://tarottraderjournal.onrender.com/ || true
